<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>倍音合成 可視化 & 音声</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<div id="container">
  <div id="left">
    <h2>倍音合成　実験</h2>

    <canvas id="canvas" width="900" height="300"></canvas>
    <canvas id="spec" width="900" height="320"></canvas>
  </div>

  <div id="right">
    <div class="controls">
      <button onclick="toggleUpperHarmonics()">17〜32倍音 表示切替</button>
      <button onclick="startAudio()">▶ 再生</button>
      <button onclick="stopAudio()">■ 停止</button>
    </div>

    <div class="controls">
      マスター音量
      <input id="masterRange" type="range" min="0" max="1" step="0.01" value="0.3"
             oninput="setMaster(+this.value)">
    </div>

    <div class="controls">
      基音周波数 (Hz)
      <input id="baseFreqInput" type="number" value="233.08" min="20" max="2000" step="1"
             oninput="setBaseFreq(+this.value)">
    </div>

    <div class="controls">
      ピッチ基準 A4(Hz)
      <input id="a4Input" type="number" value="442" min="400" max="500" step="1"
             oninput="setA4(+this.value)">
    </div>

    <div class="controls">
      <button onclick="octaveDown()">⬇ 1oct</button>
      <button onclick="octaveUp()">⬆ 1oct</button>
    </div>

    <div class="controls" id="noteButtons"></div>

    <div class="controls">
      <b>プリセット（読み込み専用）</b><br>
      <button id="slotMenuBtn">プリセットを表示</button>
      <div id="slotMenu" class="slot-menu"></div>
    </div>

    <div class="controls">
      <button id="toggleInput">数値入力モード</button>
      <div id="inputArea" class="hidden"></div>
    </div>
  </div>
</div>

<script src="JavaScript/main.js"></script>
</body>
</html>
